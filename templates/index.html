<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParFix Web Utility Pro</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --sidebar-bg: #16161e;
            --panel-bg: #24283b;
            --text-color: #a9b1d6;
            --text-muted: #565f89;
            --accent-color: #7aa2f7;
            --success-color: #9ece6a;
            --error-color: #f7768e;
            --warning-color: #e0af68;
            --border-color: #414868;
        }

        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 80px; /* Collapsed width */
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            transition: width 0.3s;
            z-index: 10;
        }

        #sidebar:hover {
            width: 200px;
        }

        .nav-item {
            width: 100%;
            padding: 15px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center; /* Center icon initially */
            color: var(--text-muted);
            transition: all 0.2s;
            position: relative;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--accent-color);
            background-color: rgba(122, 162, 247, 0.1);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background-color: var(--accent-color);
        }

        .nav-icon {
            font-size: 1.5em;
            min-width: 80px; /* Fixed width for icon center */
            text-align: center;
        }

        .nav-label {
            display: none;
            white-space: nowrap;
            font-size: 1em;
            font-weight: bold;
            padding-right: 20px;
        }

        #sidebar:hover .nav-label {
            display: block;
        }

        #sidebar:hover .nav-item {
            justify-content: flex-start;
        }

        /* --- Main Layout --- */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Prevent flex overflow */
        }

        /* --- Top Bar --- */
        #top-bar {
            height: 50px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .app-title {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1em;
        }

        .status-container {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 0.9em;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-track {
            width: 80px;
            height: 6px;
            background: #2f3549;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.5s;
        }

        /* --- Views Container --- */
        #views-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #1a1b26;
        }

        .view-section {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .view-section.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- File Browser Styles --- */
        .browser-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .browser-tabs {
            display: flex;
            gap: 20px;
        }

        .browser-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1em;
            padding-bottom: 5px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .browser-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        #file-list-container {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .file-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #2f3549;
            display: flex;
            align-items: center;
        }

        .file-item:hover { background-color: #2f3549; }
        .file-item.selected { background-color: #3b4261; color: var(--accent-color); }

        .icon { margin-right: 12px; font-weight: bold; font-size: 1.1em; }
        .dir-icon { color: var(--accent-color); }
        .file-icon { color: #565f89; }
        .par2-icon { color: var(--success-color); }

        /* --- Controls Area --- */
        #controls-area {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--panel-bg);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Button Styles */
        button {
            background-color: var(--accent-color);
            color: #15161e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            flex: 1;
            min-width: 100px;
            transition: opacity 0.2s;
        }

        button:disabled {
            background-color: dimgray !important;
            color: #ccc;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) { opacity: 0.9; }

        button.secondary { background-color: var(--success-color); }
        button.danger { background-color: var(--error-color); }
        button.purple-btn { background-color: #bb9af7; }
        button.info-btn { background-color: #7dcfff; }
        button.warning-btn { background-color: var(--warning-color); }

        button.icon-btn {
            flex: 0;
            padding: 8px 12px;
            min-width: auto;
        }

        /* --- Job Queue View --- */
        #job-queue-container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .job-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .job-card:hover { background-color: #2a2f45; }
        .job-card.running { border-left: 4px solid var(--accent-color); }
        .job-card.queued { border-left: 4px solid var(--text-muted); }
        .job-card.completed { border-left: 4px solid var(--success-color); }
        .job-card.failed { border-left: 4px solid var(--error-color); }

        .job-header { display: flex; justify-content: space-between; align-items: center; }
        .job-name { font-size: 1.1em; font-weight: bold; color: #c0caf5; display: block; margin-bottom: 5px; }
        .job-meta { color: var(--text-muted); font-size: 0.9em; }

        .job-details {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: none;
            font-size: 0.9em;
        }
        .job-details.expanded { display: block; }

        .btn-cancel {
            background-color: var(--error-color);
            color: #15161e;
            padding: 5px 10px;
            font-size: 0.8em;
            border-radius: 4px;
            margin-left: 10px;
        }

        /* --- Logs View --- */
        #console {
            background-color: #15161e;
            color: #c0caf5;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* --- Settings View --- */
        .settings-container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .settings-header {
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--accent-color);
        }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-color); font-weight: bold; }
        .form-group input[type="text"], .form-group input[type="number"], .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #1a1b26;
            border: 1px solid var(--border-color);
            color: #c0caf5;
            border-radius: 4px;
            font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: var(--accent-color); }

        /* Modals (Keep existing style) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background-color: var(--panel-bg);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--border-color);
            width: 500px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header h3 { margin: 0 0 20px 0; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;}
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;}

        /* Toasts */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background-color: var(--panel-bg);
            border-left: 5px solid var(--accent-color);
            color: #fff;
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            min-width: 250px;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease-in-out;
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { border-left-color: var(--error-color); }
        .toast.success { border-left-color: var(--success-color); }

        /* Breadcrumb */
        .breadcrumb { margin-bottom: 10px; color: var(--text-muted); font-size: 0.95em; }
        .breadcrumb span:hover { color: var(--accent-color); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="nav-item active" onclick="switchView('files')">
            <div class="nav-icon">📂</div>
            <div class="nav-label">Files</div>
        </div>
        <div class="nav-item" onclick="switchView('queue')">
            <div class="nav-icon">⏳</div>
            <div class="nav-label">Queue</div>
        </div>
        <div class="nav-item" onclick="switchView('logs')">
            <div class="nav-icon">📜</div>
            <div class="nav-label">Logs</div>
        </div>
        <div class="nav-item" style="margin-top: auto;" onclick="switchView('settings')">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Settings</div>
        </div>
    </aside>

    <!-- Main Content -->
    <div id="main-wrapper">

        <!-- Top Bar -->
        <header id="top-bar">
            <div class="app-title">ParFix Pro</div>

            <!-- Active Job Widget -->
            <div id="active-job-widget" style="margin-left: 20px; flex: 1; color: var(--text-muted); font-size: 0.9em; display:flex; align-items:center;">
                <!-- JS will update this -->
                <span id="active-job-text">Idle</span>
            </div>

            <div class="status-container">
                <div class="stat-item">
                    <span>💾</span>
                    <div class="progress-track"><div id="stat-disk-bar" class="progress-fill"></div></div>
                    <span id="stat-disk-text">0%</span>
                </div>
                <div class="stat-item">
                    <span>🧠</span>
                    <div class="progress-track"><div id="stat-ram-bar" class="progress-fill" style="background:#bb9af7"></div></div>
                    <span id="stat-ram-text">0%</span>
                </div>
                <div class="stat-item">
                    <span>⚙️</span>
                    <span id="stat-cpu-text">0%</span>
                </div>
            </div>
        </header>

        <!-- Views Container -->
        <div id="views-container">

            <!-- VIEW: FILES -->
            <div id="view-files" class="view-section active">

                <div class="browser-header">
                    <div class="browser-tabs">
                        <button id="tab-local" class="browser-tab active" onclick="switchBrowserMode('local')">Local Files</button>
                        <button id="tab-cloud" class="browser-tab" onclick="switchBrowserMode('cloud')">Cloud Remotes</button>
                    </div>

                    <div style="display:flex; gap:10px; align-items:center;">
                        <label style="cursor:pointer; font-size:0.9em; color:var(--text-muted); margin-right: 10px;">
                            <input type="checkbox" id="select-all-check"> Select All
                        </label>
                        <button id="new-folder-btn" class="icon-btn" style="background:none; border:1px solid var(--border-color); color:var(--accent-color);" title="New Folder">📂+</button>
                        <button id="refresh-btn" class="icon-btn" style="background:none; border:1px solid var(--border-color); color:var(--accent-color);" title="Refresh">🔄</button>
                    </div>
                </div>

                <div id="current-path" class="breadcrumb">/</div>

                <div id="file-list-container">
                    <ul id="file-list">
                        <!-- JS Injected -->
                    </ul>
                </div>

                <div id="controls-area">
                    <!-- Local Controls -->
                    <div id="local-controls" style="display:contents;">
                        <div id="controls">
                            <button id="repair-btn" disabled>Repair</button>
                            <button id="extract-btn" style="background-color:#00d9ff;" disabled>Extract</button>
                            <button id="archive-btn" class="secondary" disabled>Pack</button>
                            <button id="upload-btn" class="purple-btn" disabled>Upload</button>
                            <button id="move-btn" class="warning-btn" disabled>➡️ Move</button>
                            <button id="copy-btn" class="info-btn" disabled>📋 Copy</button>
                            <button id="rename-btn" class="warning-btn" style="background-color:#e0af68;" disabled>✏️ Rename</button>
                            <button id="inspect-btn" class="purple-btn" disabled>ℹ️ Info</button>
                            <button id="delete-btn" class="danger" disabled>🗑️</button>
                        </div>
                    </div>

                    <!-- Cloud Controls -->
                    <div id="cloud-controls" style="display:none; width:100%;">
                        <div style="display:flex; gap:10px; flex-wrap:wrap;">
                            <button id="cloud-move-btn" class="warning-btn" disabled>➡️ Move</button>
                            <button id="cloud-copy-btn" class="info-btn" disabled>📋 Copy</button>
                            <button id="cloud-rename-btn" class="warning-btn" style="background-color:#e0af68;" disabled>✏️ Rename</button>
                            <button id="cloud-delete-btn" class="danger" disabled>🗑️ Delete</button>
                            <button id="download-btn" class="purple-btn" style="flex: 2;" disabled>☁️ Download to VPS</button>
                        </div>
                    </div>
                </div>

            </div>

            <!-- VIEW: QUEUE -->
            <div id="view-queue" class="view-section">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="margin:0; border:none;">Job Queue</h2>
                    <button class="secondary" onclick="fetchJobs()" style="flex:0;">Refresh</button>
                </div>
                <div id="job-queue-container">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- VIEW: LOGS -->
            <div id="view-logs" class="view-section">
                <h2 style="margin-top:0; border:none; margin-bottom:10px;">System Logs</h2>
                <div id="console">Waiting for logs...</div>
            </div>

            <!-- VIEW: SETTINGS -->
            <div id="view-settings" class="view-section">
                <div class="settings-container">
                    <h2 class="settings-header">Configuration</h2>

                    <div class="form-group">
                        <label>Discord Webhook URL</label>
                        <input type="text" id="set-discord" placeholder="https://discord.com/api/webhooks/...">
                    </div>

                    <div class="form-group">
                        <label>Telegram Bot Token</label>
                        <input type="text" id="set-tg-token" placeholder="123456:ABC-DEF...">
                    </div>

                    <div class="form-group">
                        <label>Telegram Chat ID</label>
                        <input type="text" id="set-tg-chat" placeholder="123456789">
                    </div>

                    <div class="form-group" style="border-top:1px solid var(--border-color); padding-top:20px;">
                        <label>Upload Rclone Config (rclone.conf)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="file" id="config-file-input" style="background:none; border:none; padding:0; color:#a9b1d6;">
                            <button id="upload-config-btn" class="purple-btn" style="flex:0; min-width:100px;">Upload</button>
                        </div>
                    </div>

                    <div style="text-align:right; margin-top:30px;">
                        <button id="save-set" class="secondary" style="width:200px;">Save Changes</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modals (Hidden by default) -->
    <!-- Archive Modal -->
    <div id="archive-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Create Archive (Pack)</h3></div>
            <div class="form-group"><label>Name:</label><input type="text" id="arc-name"></div>
            <div class="form-group"><label>Format:</label><select id="arc-fmt"><option value="rar">RAR</option><option value="7z">7-Zip</option></select></div>
            <div class="form-group"><label>Split:</label><select id="arc-size"><option value="100M">100M</option><option value="500M">500M</option><option value="1024M" selected>1GB</option><option value="2048M">2GB</option><option value="5120M">5GB</option></select></div>
            <div class="form-group"><label>Pass:</label><input type="text" id="arc-pass"></div>
            <div class="form-group"><label><input type="checkbox" id="arc-par2" checked> Create PAR2</label></div>
            <div class="form-group"><label><input type="checkbox" id="arc-upload"> Upload after</label></div>
            <div id="arc-upload-opts" style="display:none; padding-left:15px; border-left:2px solid var(--border-color);">
                <div class="form-group"><label>Remote:</label><select id="arc-remote"></select></div>
                <div class="form-group"><label>Path:</label><input type="text" id="arc-upload-path" placeholder="ParFix_Uploads/"></div>
            </div>
            <div class="modal-actions">
                <button id="cancel-arc" class="danger">Cancel</button>
                <button id="start-arc" class="secondary">Pack</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Manual Upload</h3></div>
            <div class="form-group"><label>Remote:</label><select id="up-remote"></select></div>
            <div class="form-group"><label>Path:</label><input type="text" id="up-path" placeholder="ParFix_Uploads/"></div>
            <div class="form-group"><label>Transfers:</label><input type="number" id="up-transfers" value="4"></div>
            <div class="modal-actions"><button id="cancel-up" class="danger">Cancel</button><button id="start-up" class="secondary">Start</button></div>
        </div>
    </div>

    <!-- Extract Modal -->
    <div id="extract-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3>Extract</h3></div>
            <div class="form-group"><label>Method:</label><select id="ext-method"><option value="unrar">UnRAR</option><option value="7z">7-Zip</option></select></div>
            <div class="form-group"><label>Password:</label><input type="text" id="ext-pass"></div>
            <div class="modal-actions"><button id="cancel-ext" class="danger">Cancel</button><button id="confirm-ext" class="secondary">Extract</button></div>
        </div>
    </div>

    <!-- Move/Copy/Download Modal -->
    <div id="move-copy-modal" class="modal">
        <div class="modal-content" style="width: 500px;">
            <div class="modal-header"><h3 id="mc-title">Select Destination</h3></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <label>Browser:</label>
                <button id="mc-new-folder-btn" class="icon-btn" style="font-size:0.8em;">📂+</button>
            </div>
            <div id="mc-browser" style="border:1px solid var(--border-color); height:200px; overflow-y:auto; background:#15161e; padding:5px; margin-bottom:10px;"></div>
            <div style="display:flex; gap:10px; align-items:center;">
                <strong id="mc-selected-path" style="color:var(--accent-color);">/</strong>
                <button id="mc-up-btn" class="icon-btn">⬆️</button>
            </div>
            <div class="modal-actions"><button id="cancel-mc" class="danger">Cancel</button><button id="confirm-mc" class="secondary">Confirm</button></div>
        </div>
    </div>

    <!-- Rename/Mkdir/Inspect Modals -->
    <div id="rename-modal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Rename</h3></div><input type="text" id="rename-input" style="width:100%; padding:10px; margin-bottom:20px;"><div class="modal-actions"><button id="cancel-rename" class="danger">Cancel</button><button id="confirm-rename" class="secondary">Rename</button></div></div></div>
    <div id="mkdir-modal" class="modal"><div class="modal-content"><div class="modal-header"><h3>New Folder</h3></div><input type="text" id="mkdir-name" style="width:100%; padding:10px; margin-bottom:20px;"><div class="modal-actions"><button id="cancel-mkdir" class="danger">Cancel</button><button id="confirm-mkdir" class="secondary">Create</button></div></div></div>
    <div id="inspect-modal" class="modal"><div class="modal-content" style="width:600px;"><div class="modal-header"><h3>File Info</h3></div><div id="inspect-content" style="max-height:400px; overflow-y:auto;"></div><div class="modal-actions"><button id="close-inspect" class="secondary">Close</button></div></div></div>

    <div id="toast-container"></div>

    <script>
        // --- View Router ---
        function switchView(viewName) {
            // Hide all views
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');

            // Update Sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            // Find the item with correct click handler logic (simple matching)
            const navItems = document.querySelectorAll('.nav-item');

        // --- Stats ---
        function startStatsPoller() {
            fetchStats();
            setInterval(fetchStats, 5000);

        async function fetchStats() {
            try {
                const res = await fetch('/api/system/stats');
                const data = await res.json();
                document.getElementById('stat-disk-bar').style.width = data.disk.percent + '%';
                document.getElementById('stat-disk-text').textContent = data.disk.free_gb + 'GB Free';
                document.getElementById('stat-ram-bar').style.width = data.ram + '%';
                document.getElementById('stat-ram-text').textContent = data.ram + '%';
                document.getElementById('stat-cpu-text').textContent = data.cpu + '%';
            } catch(e) {}
        }

        // --- Logs ---
        const consoleDiv = document.getElementById('console');
        const evtSource = new EventSource("/api/logs");
        evtSource.onmessage = function(event) {
            const newLog = document.createElement('div');
            newLog.textContent = event.data;
            consoleDiv.appendChild(newLog);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        // --- Jobs ---
        const jobQueueContainer = document.getElementById('job-queue-container');
        const activeJobText = document.getElementById('active-job-text');

        function startJobPoller() {
            fetchJobs();
            setInterval(fetchJobs, 2000);
        }
        async function fetchJobs() {
            try {
                const res = await fetch('/api/jobs');
                const data = await res.json();
                renderJobQueue(data);
                updateActiveJobWidget(data);
            } catch (e) {}
        }

        function updateActiveJobWidget(data) {
            if(data.current) {
                activeJobText.textContent = `Running: ${data.current.name}`;
                activeJobText.style.color = 'var(--accent-color)';
            } else if (data.pending && data.pending.length > 0) {
                activeJobText.textContent = `${data.pending.length} Jobs Queued`;
                activeJobText.style.color = 'var(--text-muted)';
            } else {
                activeJobText.textContent = "Idle";
                activeJobText.style.color = 'var(--text-muted)';
            }
        }

        function renderJobQueue(data) {
            jobQueueContainer.innerHTML = '';

            if (data.current) {
                jobQueueContainer.innerHTML += '<h3>Running</h3>';
                jobQueueContainer.appendChild(createJobCard(data.current, 'running'));
            }
            if (data.pending && data.pending.length > 0) {
                jobQueueContainer.innerHTML += '<h3>Pending</h3>';
                data.pending.forEach(j => jobQueueContainer.appendChild(createJobCard(j, 'queued')));
            }
            if (data.history && data.history.length > 0) {
                jobQueueContainer.innerHTML += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;border-bottom:1px solid #414868;padding-bottom:5px;"><h3>History</h3><button class="icon-btn" onclick="clearHistory()">Clear</button></div>`;
                data.history.forEach(j => jobQueueContainer.appendChild(createJobCard(j, j.status || 'completed')));
            }
            if (!data.current && (!data.pending || data.pending.length === 0) && (!data.history || data.history.length === 0)) {
                jobQueueContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:50px;">Queue is empty</div>';
            }
        }

        function createJobCard(job, status) {
            const card = document.createElement('div');
            card.className = `job-card ${status}`;

            let statusText = status.toUpperCase();
            if(status==='running') statusText = 'RUNNING...';

            card.innerHTML = `
                <div class="job-header">
                    <div>
                        <span class="job-name">${job.name}</span>
                        <span class="job-meta">${statusText}</span>
                    </div>
                    ${(status==='running'||status==='queued') ? `<button class="btn-cancel" onclick="cancelJob('${job.id}', event)">Cancel</button>` : ''}
                </div>
                <div class="job-details" id="details-${job.id}">${renderJobDetails(job.details)}</div>
            `;

            if(expandedJobIds.has(job.id)) card.querySelector('.job-details').classList.add('expanded');

            card.onclick = (e) => {
                if(e.target.tagName === 'BUTTON') return;
                const det = card.querySelector('.job-details');
                if(det.classList.contains('expanded')) {
                    det.classList.remove('expanded');
                    expandedJobIds.delete(job.id);
                } else {
                    det.classList.add('expanded');
                    expandedJobIds.add(job.id);
                }
            };
            return card;
        }

        function renderJobDetails(details) {
            if(!details) return 'No details.';
            let html = '';
            // Render basic keys
            for(const [k,v] of Object.entries(details)) {
                if(k==='targets') continue;
                html += `<div><strong>${k}:</strong> ${v}</div>`;
            }
            // Render targets
            if(details.targets && Array.isArray(details.targets)) {
                html += `<div style="margin-top:5px;"><strong>Files:</strong><ul style="margin:0;padding-left:20px;max-height:100px;overflow-y:auto;">${details.targets.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
            }
            return html || 'No details.';
        }

        async function cancelJob(id, e) {
            if(e) e.stopPropagation();
            if(confirm("Cancel Job?")) {
                await fetch(`/api/jobs/cancel/${id}`, {method:'POST'});
                fetchJobs();
            }
        }
        async function clearHistory() {
            if(confirm("Clear History?")) {
                await fetch('/api/jobs/history/clear', {method:'POST'});
                fetchJobs();
            }
        }

        // --- Browser Logic ---
        function switchBrowserMode(mode) {
            browserMode = mode;
            selectedPaths = [];
            selectAllCheck.checked = false;

            if(mode === 'local') {
                tabLocal.classList.add('active');
                tabCloud.classList.remove('active');
                localControls.style.display = 'contents';
                cloudControls.style.display = 'none';
                loadPath('');
            } else {
                tabCloud.classList.add('active');
                tabLocal.classList.remove('active');
                localControls.style.display = 'none';
                cloudControls.style.display = 'block';
                loadRemotesList();
            }
            updateButtonState();
        }

        async function loadPath(path) {
            if(browserMode==='local') loadLocalPath(path);
            else loadCloudPath(path);
        }

        async function loadLocalPath(path) {
            try {
                fileList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Loading...</div>';
                const res = await fetch(`/api/list?path=${encodeURIComponent(path)}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                currentPath = data.current_path;
                renderBreadcrumb(currentPath, 'local');
                renderFiles(data.items, data.parent_path);
            } catch(e) { showToast(e.message, 'error'); }
        }

        async function loadRemotesList() {
            try {
                fileList.innerHTML = '<div style="padding:20px;text-align:center;">Loading Remotes...</div>';
                const res = await fetch('/api/remotes');
                const remotes = await res.json();

                currentPath = ''; currentRemote = '';
                breadcrumb.innerHTML = '<span style="color:var(--accent-color);">Cloud Remotes</span>';

                fileList.innerHTML = '';
                remotes.forEach(r => {
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerHTML = `<span class="icon" style="color:#bb9af7">☁️</span> ${r}`;
                    li.onclick = () => loadCloudPath('', r);
                    fileList.appendChild(li);
                });
            } catch(e) { showToast('Error loading remotes', 'error'); }
        }

        async function loadCloudPath(path, remoteOverride=null) {
            if(remoteOverride) currentRemote = remoteOverride;
            if(!currentRemote) { loadRemotesList(); return; }

            try {
                fileList.innerHTML = '<div style="padding:20px;text-align:center;">Loading Cloud...</div>';
                const res = await fetch(`/api/rclone/list?remote=${encodeURIComponent(currentRemote)}&path=${encodeURIComponent(path)}`);
                const data = await res.json();
                if(data.error) throw new Error(data.error);

                currentPath = data.current_path;
                renderBreadcrumb(currentPath, 'cloud');

                fileList.innerHTML = '';
                if(currentPath==='') {
                    const li = document.createElement('li'); li.className='file-item';
                    li.innerHTML = '<span class="icon dir-icon">📁</span> .. (Remotes)';
                    li.onclick = () => loadRemotesList();
                    fileList.appendChild(li);
                } else if(data.parent_path !== null) {
                    const li = document.createElement('li'); li.className='file-item';
                    li.innerHTML = '<span class="icon dir-icon">📁</span> ..';
                    li.onclick = () => loadCloudPath(data.parent_path);
                    fileList.appendChild(li);
                }

                data.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'file-item';

                    const cb = document.createElement('input'); cb.type='checkbox';
                    cb.dataset.path = item.path;
                    cb.onclick = (e) => { e.stopPropagation(); toggleSelection(item.path, cb.checked); };

                    let icon = item.is_dir ? '📁' : '📄';
                    let cls = item.is_dir ? 'dir-icon' : 'file-icon';
                    if(!item.is_dir && /\.(mkv|mp4|avi)$/i.test(item.name)) icon = '🎬';
                    if(!item.is_dir && item.name.endsWith('.par2')) { icon='🔧'; cls='par2-icon'; }

                    li.innerHTML = `<span class="${cls} icon">${icon}</span> <span>${item.name}</span>`;
                    li.prepend(cb);

                    if(item.size) {
                        const sz = document.createElement('span');
                        sz.style.marginLeft='auto'; sz.style.fontSize='0.8em'; sz.style.color='var(--text-muted)';
                        sz.textContent = formatBytes(item.size);
                        li.appendChild(sz);
                    }

                    if(item.is_dir) li.onclick = (e) => { if(e.target!==cb) loadCloudPath(item.path); };

                    fileList.appendChild(li);
                });
            } catch(e) { showToast(e.message, 'error'); }
        }

        function renderBreadcrumb(path, mode) {
            breadcrumb.innerHTML = '';
            if(mode==='local') {
                breadcrumb.innerHTML = '<span onclick="loadPath(\'\')">ROOT</span> / ';
            } else {
                breadcrumb.innerHTML = '<span onclick="loadRemotesList()">REMOTES</span> / <span onclick="loadCloudPath(\'\')">'+currentRemote+'</span> / ';
            }
            const parts = path.split('/').filter(Boolean);
            let acc = '';
            parts.forEach((p,i) => {
                acc += (acc?'/':'')+p;
                const sp = document.createElement('span');
                sp.textContent = p + (i<parts.length-1 ? ' / ' : '');
                const target = acc;
                sp.onclick = () => loadPath(target);
                breadcrumb.appendChild(sp);
            });
        }

        function renderFiles(items, parentPath) {
            fileList.innerHTML = '';
            if(parentPath!==null) {
                const li = document.createElement('li'); li.className='file-item';
                li.innerHTML = '<span class="icon dir-icon">📁</span> ..';
                li.onclick = () => loadPath(parentPath);
                fileList.appendChild(li);
            }
            items.forEach(item => {
                const li = document.createElement('li'); li.className='file-item';
                const cb = document.createElement('input'); cb.type='checkbox';
                cb.dataset.path = item.path;
                cb.onclick = (e) => { e.stopPropagation(); toggleSelection(item.path, cb.checked); };

                let icon = item.is_dir ? '📁' : '📄';
                let cls = item.is_dir ? 'dir-icon' : 'file-icon';
                if(!item.is_dir && item.name.endsWith('.par2')) { icon='🔧'; cls='par2-icon'; }

                li.innerHTML = `<span class="${cls} icon">${icon}</span> <span>${item.name}</span>`;
                li.prepend(cb);

                if(item.is_dir) li.onclick = (e) => { if(e.target!==cb) loadPath(item.path); };
                fileList.appendChild(li);
            });
        }

        function toggleSelection(path, checked) {
            if(checked) selectedPaths.push(path);
            else selectedPaths = selectedPaths.filter(p=>p!==path);
            updateButtonState();
        }

        selectAllCheck.onclick = () => {
            const checked = selectAllCheck.checked;
            fileList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = checked;
                if(checked && cb.dataset.path) {
                    if(!selectedPaths.includes(cb.dataset.path)) selectedPaths.push(cb.dataset.path);
                }
            });
            if(!checked) selectedPaths = [];
            updateButtonState();
        };

        function updateButtonState() {
            const has = selectedPaths.length > 0;
            const single = selectedPaths.length === 1;

            if(browserMode === 'local') {
                newFolderBtn.disabled = false;
                repairBtn.disabled = !single;
                extractBtn.disabled = !single;
                archiveBtn.disabled = !single;
                renameBtn.disabled = !single;
                inspectBtn.disabled = !single;
                uploadBtn.disabled = !has;
                moveBtn.disabled = !has;
                copyBtn.disabled = !has;
                deleteBtn.disabled = !has;
            } else {
                newFolderBtn.disabled = !currentRemote;
                downloadBtn.disabled = !has;
                cloudMoveBtn.disabled = !has;
                cloudCopyBtn.disabled = !has;
                cloudDeleteBtn.disabled = !has;
                cloudRenameBtn.disabled = !single;
            }
        }

        // --- Action Handlers ---
        refreshBtn.onclick = () => loadPath(currentPath);

        repairBtn.onclick = async () => {
             if(confirm(`Repair ${selectedPaths[0]}?`)) {
                 await fetch('/api/repair', {
                     method: 'POST',
                     headers:{'Content-Type':'application/json'},
                     body: JSON.stringify({path: selectedPaths[0]})
                 });
                 showToast('Repair Queued', 'success');
             }
        };

        // Archive
        archiveBtn.onclick = async () => {
            loadRemotesSelect(arcRemoteSelect);
            arcNameInput.value = selectedPaths[0].split('/').pop();
            arcModal.style.display = 'block';
        };
        document.getElementById('start-arc').onclick = async () => {
             arcModal.style.display = 'none';
             await fetch('/api/archive', {
                 method:'POST',
                 headers:{'Content-Type':'application/json'},
                 body: JSON.stringify({
                     path: selectedPaths[0],
                     name: arcNameInput.value,
                     split_size: document.getElementById('arc-size').value,
                     password: document.getElementById('arc-pass').value,
                     format: document.getElementById('arc-fmt').value,
                     create_par2: document.getElementById('arc-par2').checked,
                     upload: document.getElementById('arc-upload').checked,
                     remote: arcRemoteSelect.value,
                     upload_path: document.getElementById('arc-upload-path').value
                 })
             });
             showToast('Pack Queued', 'success');
        };
        document.getElementById('arc-upload').onchange = (e) => {
            document.getElementById('arc-upload-opts').style.display = e.target.checked ? 'block' : 'none';
        };

        // Upload
        uploadBtn.onclick = () => { loadRemotesSelect(upRemoteSelect); upModal.style.display='block'; };
        document.getElementById('start-up').onclick = async () => {
            upModal.style.display='none';
            await fetch('/api/upload', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({
                    paths: selectedPaths,
                    remote: upRemoteSelect.value,
                    upload_path: upPathInput.value,
                    transfers: document.getElementById('up-transfers').value
                })
            });
            showToast('Upload Queued', 'success');
        };

        // Delete
        deleteBtn.onclick = async () => {
            if(confirm(`Delete ${selectedPaths.length} items?`)) {
                await fetch('/api/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths:selectedPaths})});
                loadPath(currentPath);
                showToast('Deleted', 'success');
            }
        };

        // Settings (Save)
        saveSetBtn.onclick = async () => {
            await fetch('/api/settings', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    discord_webhook: setDiscordInput.value,
                    telegram_token: setTgTokenInput.value,
                    telegram_chat_id: setTgChatInput.value
                })
            });
            showToast('Settings Saved', 'success');
        };

        async function loadSettings() {
             const res = await fetch('/api/settings');
             const data = await res.json();
             setDiscordInput.value = data.discord_webhook||'';
             setTgTokenInput.value = data.telegram_token||'';
             setTgChatInput.value = data.telegram_chat_id||'';
        }

        // Upload Config
        uploadConfigBtn.onclick = async () => {
            const f = configFileInput.files[0];
            if(!f) return;
            const fd = new FormData(); fd.append('file', f);
            const res = await fetch('/api/settings/upload-config', {method:'POST', body:fd});
            const d = await res.json();
            if(d.status==='uploaded') showToast('Config Uploaded', 'success');
            else showToast('Error', 'error');
        };

        // --- Common Helpers ---
        function showToast(msg, type='info') {
            const t = document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(()=>t.classList.add('show'),10);
            setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4000);
        }
        function formatBytes(bytes) {
            if(bytes===0) return '0 B';
            if(!bytes || isNaN(bytes)) return '-';
            const sizes=['B','KB','MB','GB','TB'];
            const i=Math.floor(Math.log(bytes)/Math.log(1024));
            return parseFloat((bytes/Math.pow(1024,i)).toFixed(2))+' '+sizes[i];
        }
        async function loadRemotesSelect(el) {
            el.innerHTML='';
            const r = await (await fetch('/api/remotes')).json();
            r.forEach(x => { const o=document.createElement('option'); o.value=x; o.textContent=x; el.appendChild(o); });
        }

        // --- Modal Closers ---
        document.querySelectorAll('.modal .danger, .modal .secondary').forEach(b => {
            if(b.id.startsWith('cancel-') || b.id.startsWith('close-')) {
                b.onclick = () => b.closest('.modal').style.display='none';
            }
        });
        window.onclick = (e) => { if(e.target.classList.contains('modal')) e.target.style.display='none'; };

        // --- Move/Copy Browser Logic ---
        function openMcModal(action) {
            mcAction=action;
            mcContext = (browserMode==='cloud' && action!=='download') ? 'cloud' : 'local';
            document.getElementById('mc-title').textContent = `${action.toUpperCase()} to ${mcContext.toUpperCase()}`;
            loadMcBrowser('');
            mcModal.style.display='block';
        }
        async function loadMcBrowser(path) {
            mcCurrentBrowserPath = path;
            const disp = document.getElementById('mc-selected-path');
            const cont = document.getElementById('mc-browser');

            disp.textContent = path || '/';
            cont.innerHTML = 'Loading...';

            try {
                let items = [];
                if(mcContext==='cloud') {
                     if(!path) {
                         const r = await(await fetch('/api/remotes')).json();
                         items = r.map(x=>({name:x, is_dir:true, fullPath:x, is_remote:true}));
                     } else {
                         let remote=path, sub='';
                         if(path.includes('/')) { remote=path.split('/')[0]; sub=path.substring(path.indexOf('/')+1); }
                         const res = await(await fetch(`/api/rclone/list?remote=${remote}&path=${sub}`)).json();
                         items = res.items.filter(i=>i.is_dir).map(i=>({name:i.name, is_dir:true, fullPath:remote+'/'+i.path}));
                     }
                } else {
                    const res = await(await fetch(`/api/list?path=${path}`)).json();
                    items = res.items.filter(i=>i.is_dir).map(i=>({name:i.name, is_dir:true, fullPath:i.path}));
                }

                cont.innerHTML = '';
                const ul = document.createElement('ul'); ul.style.listStyle='none'; ul.style.padding=0;
                items.forEach(i => {
                    const li = document.createElement('li'); li.style.padding='5px'; li.style.cursor='pointer';
                    li.innerHTML = (i.is_remote?'☁️ ':'📁 ') + i.name;
                    li.onclick = () => loadMcBrowser(i.fullPath);
                    ul.appendChild(li);
                });
                cont.appendChild(ul);
            } catch(e) { cont.textContent = 'Error'; }
        }

        document.getElementById('mc-up-btn').onclick = () => {
             if(!mcCurrentBrowserPath) return;
             if(!mcCurrentBrowserPath.includes('/')) loadMcBrowser('');
             else loadMcBrowser(mcCurrentBrowserPath.substring(0, mcCurrentBrowserPath.lastIndexOf('/')));
        };

        document.getElementById('confirm-mc').onclick = async () => {
            mcModal.style.display='none';
            const dest = mcCurrentBrowserPath;

            // Logic for Cloud/Cross-Remote
            if(mcContext==='cloud') {
                let r=currentRemote, p=dest, dr=currentRemote; // defaults
                if(dest) {
                    if(dest.includes('/')) { dr=dest.split('/')[0]; p=dest.substring(dest.indexOf('/')+1); }
                    else { dr=dest; p=''; }
                }

                const ep = (mcAction==='move'?'/api/rclone/move':'/api/rclone/copy');
                await fetch(ep, {
                    method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({remote:currentRemote, paths:selectedPaths, destination:p, dest_remote:dr})
                });
                showToast('Queued', 'success');
            } else if(mcAction==='download') {
                 await fetch('/api/rclone/download', {
                     method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify({remote:currentRemote, paths:selectedPaths, destination:dest, transfers:4})
                 });
                 showToast('Download Queued', 'success');
            } else {
                // Local to Local
                 const ep = (mcAction==='move'?'/api/move':'/api/copy');
                 await fetch(ep, {
                     method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify({paths:selectedPaths, destination:dest})
                 });
                 showToast('Completed', 'success');
                 loadPath(currentPath);
            }
        };

        // Wire remaining buttons
        moveBtn.onclick = () => openMcModal('move');
        copyBtn.onclick = () => openMcModal('copy');
        newFolderBtn.onclick = () => mkdirModal.style.display='block';
        document.getElementById('confirm-mkdir').onclick = async () => {
            mkdirModal.style.display='none';
            if(browserMode==='cloud') {
                await fetch('/api/rclone/mkdir', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remote:currentRemote, path:currentPath, name:mkdirNameInput.value})});
            } else {
                await fetch('/api/mkdir', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentPath, name:mkdirNameInput.value})});
            }
            loadPath(currentPath);
        };
        renameBtn.onclick = () => { renameInput.value=selectedPaths[0].split('/').pop(); renameModal.style.display='block'; };
        document.getElementById('confirm-rename').onclick = async () => {
            renameModal.style.display='none';
            if(browserMode==='cloud') {
                await fetch('/api/rclone/rename', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remote:currentRemote, path:selectedPaths[0], new_name:renameInput.value})});
            } else {
                await fetch('/api/rename', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selectedPaths[0], new_name:renameInput.value})});
            }
            loadPath(currentPath);
        };
        extractBtn.onclick = () => extModal.style.display='block';
        document.getElementById('confirm-ext').onclick = async () => {
            extModal.style.display='none';
            await fetch('/api/extract', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selectedPaths[0], method:document.getElementById('ext-method').value, password:document.getElementById('ext-pass').value})});
            showToast('Extract Queued', 'success');
        };
        inspectBtn.onclick = async () => {
            const res = await fetch('/api/inspect', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selectedPaths[0]})});
            const d = await res.json();
            renderInspectModal(d);
            inspectModal.style.display='block';
        };

        function renderInspectModal(data) {
            const el = document.getElementById('inspect-content');
            el.innerHTML = '';

            if (data.type === 'unknown') { el.innerHTML = '<p>No details available.</p>'; return; }

            if (data.details) {
                const table = document.createElement('table');
                table.style.width = '100%';
                table.style.borderCollapse = 'collapse';
                table.style.marginBottom = '20px';
                data.details.forEach(([key, val]) => {
                    table.innerHTML += `<tr><td style="color:#737aa2;padding:5px;border-bottom:1px solid #2f3549;width:120px;">${key}</td><td style="color:#c0caf5;padding:5px;border-bottom:1px solid #2f3549;">${val}</td></tr>`;
                });
                el.appendChild(table);
            }
            if (data.contents) {
                el.innerHTML += '<h4 style="color:#7aa2f7;margin-top:0;">Archive Contents:</h4>';
                const ul = document.createElement('ul'); ul.style.listStyle='none'; ul.style.padding='0';
                data.contents.forEach(item => {
                    ul.innerHTML += `<li style="padding:4px 0;border-bottom:1px solid #2f3549;display:flex;justify-content:space-between;"><span>${item.name}</span> <span style="color:#565f89;">${item.size}</span></li>`;
                });
                el.appendChild(ul);
            }
        }

        // --- Cloud Wiring ---
        cloudMoveBtn.onclick = () => openMcModal('move');
        cloudCopyBtn.onclick = () => openMcModal('copy');

        // Rename uses shared modal
        cloudRenameBtn.onclick = () => { renameInput.value=selectedPaths[0].split('/').pop(); renameModal.style.display='block'; };

        cloudDeleteBtn.onclick = async () => {
             if(confirm('Delete Cloud Items?')) {
                 await fetch('/api/rclone/delete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({remote:currentRemote, paths:selectedPaths})});
                 showToast('Delete Queued', 'success');
             }
        };

    </script>
</body>
</html>
