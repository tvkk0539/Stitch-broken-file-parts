<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Media Catalog</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #e50914; /* Netflix Red */
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        header {
            padding: 20px 40px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        header a {
            text-decoration: none;
            color: var(--accent);
        }
        main {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        .card-img-placeholder {
            width: 100%;
            height: 300px;
            background: linear-gradient(45deg, #333, #444);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 3rem;
        }
        .card-content {
            padding: 10px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        /* Detail Page */
        .hero {
            display: flex;
            gap: 40px;
            margin-top: 40px;
        }
        .poster {
            width: 300px;
            height: 450px;
            background: #333;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .info {
            flex-grow: 1;
        }
        .info h1 {
            font-size: 3rem;
            margin-top: 0;
        }
        .meta-tags {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            color: var(--text-muted);
        }
        .btn-download {
            background-color: var(--text-main);
            color: #000;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            display: inline-block;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #ccc;
        }
        .file-info {
            margin-top: 30px;
            background: #222;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <header>
        <a href="/"><h1>Catalog</h1></a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
