{% extends "base.html" %}

{% block content %}
<h2>Recently Added</h2>
<div class="grid">
    {% for item in catalog %}
    <a href="/view/{{ item.id }}" class="card">
        <div class="card-img-placeholder">
            {{ item.title[0] | upper }}
        </div>
        <div class="card-content">
            <div class="card-title">{{ item.title }}</div>
            <div class="card-meta">{{ item.size_human }} • {{ item.category }}</div>
        </div>
    </a>
    {% else %}
    <p style="color: #999;">No items found in the catalog.</p>
    {% endfor %}
</div>
{% endblock %}
