version: "3.8"

services:
  parfix:
    build: .
    container_name: parfix
    # Use host networking or specific ports
    ports:
      - "5001:5000"
    environment:
      # This tells the app where to look for files inside the container
      - DOWNLOAD_ROOT=/data/downloads
    volumes:
      # CRITICAL: Map your actual download folder here
      # Change './downloads' to your real path, e.g., '/home/user/downloads' or '/mnt/storage/downloads'
      - ./downloads:/data/downloads
    restart: unless-stopped
    # Limit resources as per "lightweight" requirement
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.5'
