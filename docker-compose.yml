version: "3.8"

services:
  parfix:
    build: .
    container_name: parfix
    ports:
      - "5001:5000"
    environment:
      - DOWNLOAD_ROOT=/data/downloads
    volumes:
      # Map your actual download folder
      - ./downloads:/data/downloads
      # Map config for persistent settings
      - ./config:/app/config.json
      # Map Rclone config for Cloud Uploads (Optional)
      # - ~/.config/rclone/rclone.conf:/root/.config/rclone/rclone.conf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.5'
